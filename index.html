<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>GameBOX Fumi</title><link rel="stylesheet" href="style.css"></head><body>
<div class="bg-shape shape-1"></div><div class="bg-shape shape-2"></div><div class="bg-shape shape-3"></div><div class="app-container">
<header class="glass-header"><span class="logo-text">GameBOX</span> Fumi<small>ひと休みに、ひと遊び。</small></header><main class="main-content">
<section id="home" class="tab-content active"><div class="glass-card"><div class="eyebrow">100 GAMES · FREE TO PLAY</div><h1>今日の遊びを<br>見つけよう。</h1><p class="muted">パズルも、反射神経も、運試しも。<br>好きなゲームを選んですぐスタート。</p><div class="game-featured-card"><span class="game-badge">おすすめ</span><h3>🧠 神経衰弱</h3><p>同じ絵柄を見つけてペアをそろえよう。</p><button class="btn-primary" data-game="memory">今すぐ遊ぶ</button></div></div><div class="glass-card"><h2>人で選ぶ</h2><div id="home-games" class="game-grid"></div><button class="secondary" data-tab="play">全100ゲームを見る →</button></div><div class="glass-card" id="secret-shop"><h2>Fumiポイント交換所</h2><p class="muted">貯めたポイントで、秘密のゲームを解放できます。</p><p id="shop-balance" class="stat-value"></p><button id="unlock-secret" class="btn-primary">秘密のゲームと交換 · 500 pt</button><p id="shop-status" role="status"></p></div></section>
<section id="play" class="tab-content"><div class="section-heading"><h2>すべてのゲーム</h2><span id="game-count">99作品</span></div><label class="search-label">ゲームを探す<input id="search" type="search" placeholder="名前・ジャンルで検索"></label><div id="game-list" class="game-grid"></div><p id="no-results" hidden>該当するゲームがありません。</p></section>
<section id="achievements" class="tab-content"><div class="glass-card"><h2>戦績 & Fumiポイント</h2><div id="stats" class="stats-grid"></div></div><div class="glass-card"><h2>ゲーム別の記録</h2><div id="records"></div></div></section>
<section id="settings" class="tab-content"><div class="glass-card"><h2>設定とデータ</h2><p class="muted">戦績はこのブラウザーに自動保存されます。</p><label class="setting-item"><input id="motion" type="checkbox"> アニメーションを控えめにする</label><button id="export" class="secondary">戦績をバックアップ</button><label class="secondary file-label">バックアップを読み込む<input id="import" type="file" accept="application/json,.json"></label><button id="reset-data" class="secondary danger">戦績をリセット</button><p id="settings-status" role="status"></p></div></section>
</main><nav class="bottom-nav glass-nav" aria-label="メインナビゲーション"><button class="nav-item active" data-tab="home">🏠<span>ホーム</span></button><button class="nav-item" data-tab="play">🎮<span>プレイ</span></button><button class="nav-item" data-tab="achievements">🏆<span>実績</span></button><button class="nav-item" data-tab="settings">⚙️<span>設定</span></button></nav></div>
<dialog id="game-dialog" aria-labelledby="game-title"><div class="game-top"><h2 id="game-title"></h2><button id="close-game" class="secondary" aria-label="ゲームを閉じる">✕</button></div><p id="game-help" class="muted"></p><div id="difficulty-picker"><label for="difficulty">難易度</label><select id="difficulty"><option value="easy">かんたん</option><option value="normal" selected>ふつう</option><option value="hard">むずかしい</option></select><button id="start-game" class="btn-primary">この難易度でスタート</button></div><div id="game-status" role="status" aria-live="polite"></div><div id="game-board"></div><div id="game-controls"></div><button id="restart" class="secondary">最初から遊ぶ</button></dialog><script src="script.js"></script></body></html>
